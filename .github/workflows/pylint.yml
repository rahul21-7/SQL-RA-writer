name: Pylint

on: [push]

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # Speeds up future runs by caching downloads

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 1. Install specific Torch CUDA build
        pip install torch==2.5.1+cu121 torchvision==0.20.1+cu121 torchaudio==2.5.1+cu121 --extra-index-url https://download.pytorch.org/whl/cu121
        
        # 2. Install compatible xformers version without checking dependencies
        pip install xformers==0.0.28.post3 --no-deps
        
        # 3. Install the rest of the requirements
        pip install -r requirements.txt

    - name: Running the code with python
      # This PowerShell command finds all .py files and runs them
      run: |
        Get-ChildItem -Recurse -Filter *.py | ForEach-Object { python $_.FullName }
